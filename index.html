<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEDOW AUDIO MIXER</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header>
      <div class="logo">AVEDOW</div>
      <div class="subtitle">AUDIO MIXER</div>
    </header>

    <section class="player-card">

      <div class="song-info">
        <div class="disc">♫</div>
        <div>
          <div id="songName">Belum ada lagu</div>
          <small id="status">Pilih file MP3 untuk mulai</small>
        </div>
      </div>

      <input id="fileInput" type="file" accept="audio/*" hidden>

      <button id="chooseBtn" class="main-btn">
        ＋ PILIH LAGU
      </button>

      <audio id="audio"></audio>

      <div class="progress-area">
        <span id="currentTime">00:00</span>
        <input id="seekBar" type="range" min="0" max="100" value="0">
        <span id="duration">00:00</span>
      </div>

      <div class="controls">
        <button id="backBtn">↶</button>
        <button id="playBtn" class="play">▶</button>
        <button id="stopBtn">■</button>
      </div>

    </section>

    <section class="visualizer-card">
      <canvas id="visualizer"></canvas>
    </section>

    <section class="eq-card">

      <div class="section-title">
        <span>10 BAND EQUALIZER</span>
        <button id="resetBtn">RESET</button>
      </div>

      <div class="eq">

        <div class="band">
          <input class="eqSlider" data-index="0" type="range" min="-12" max="12" value="0">
          <span>60Hz</span>
        </div>

        <div class="band">
          <input class="eqSlider" data-index="1" type="range" min="-12" max="12" value="0">
          <span>120Hz</span>
        </div>

        <div class="band">
          <input class="eqSlider" data-index="2" type="range" min="-12" max="12" value="0">
          <span>250Hz</span>
        </div>

        <div class="band">
          <input class="eqSlider" data-index="3" type="range" min="-12" max="12" value="0">
          <span>500Hz</span>
        </div>

        <div class="band">
          <input class="eqSlider" data-index="4" type="range" min="-12" max="12" value="0">
          <span>1kHz</span>
        </div>

        <div class="band">
          <input class="eqSlider" data-index="5" type="range" min="-12" max="12" value="0">
          <span>2kHz</span>
        </div>

        <div class="band">
          <input class="eqSlider" data-index="6" type="range" min="-12" max="12" value="0">
          <span>4kHz</span>
        </div>

        <div class="band">
          <input class="eqSlider" data-index="7" type="range" min="-12" max="12" value="0">
          <span>8kHz</span>
        </div>

        <div class="band">
          <input class="eqSlider" data-index="8" type="range" min="-12" max="12" value="0">
          <span>12kHz</span>
        </div>

        <div class="band">
          <input class="eqSlider" data-index="9" type="range" min="-12" max="12" value="0">
          <span>16kHz</span>
        </div>

      </div>

    </section>

    <section class="bottom-card">

      <div class="volume-box">
        <span>VOLUME</span>
        <input id="volume" type="range" min="0" max="100" value="80">
        <b id="volumeText">80%</b>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
