<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AVEDOW Audio Mixer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <h1>AVEDOW AUDIO MIXER</h1>
    <p class="subtitle">MP3 Equalizer Studio</p>

    <div class="player">

      <div class="cover">♫</div>

      <h2 id="songName">Belum ada lagu</h2>
      <p id="status">Pilih file audio</p>

      <input
        type="file"
        id="fileInput"
        accept="audio/*"
        hidden
      >

      <button id="chooseBtn">
        Pilih Lagu
      </button>

      <audio id="audio" controls></audio>

      <div class="buttons">
        <button id="playBtn">▶ Play</button>
        <button id="pauseBtn">Ⅱ Pause</button>
        <button id="stopBtn">■ Stop</button>
      </div>

    </div>


    <div class="panel">

      <h2>Equalizer</h2>

      <div class="eq">

        <div>
          <input class="eqSlider" data-index="0"
                 type="range" min="-12" max="12" value="0">
          <span>60Hz</span>
        </div>

        <div>
          <input class="eqSlider" data-index="1"
                 type="range" min="-12" max="12" value="0">
          <span>120Hz</span>
        </div>

        <div>
          <input class="eqSlider" data-index="2"
                 type="range" min="-12" max="12" value="0">
          <span>250Hz</span>
        </div>

        <div>
          <input class="eqSlider" data-index="3"
                 type="range" min="-12" max="12" value="0">
          <span>500Hz</span>
        </div>

        <div>
          <input class="eqSlider" data-index="4"
                 type="range" min="-12" max="12" value="0">
          <span>1kHz</span>
        </div>

        <div>
          <input class="eqSlider" data-index="5"
                 type="range" min="-12" max="12" value="0">
          <span>2kHz</span>
        </div>

        <div>
          <input class="eqSlider" data-index="6"
                 type="range" min="-12" max="12" value="0">
          <span>4kHz</span>
        </div>

        <div>
          <input class="eqSlider" data-index="7"
                 type="range" min="-12" max="12" value="0">
          <span>8kHz</span>
        </div>

        <div>
          <input class="eqSlider" data-index="8"
                 type="range" min="-12" max="12" value="0">
          <span>12kHz</span>
        </div>

        <div>
          <input class="eqSlider" data-index="9"
                 type="range" min="-12" max="12" value="0">
          <span>16kHz</span>
        </div>

      </div>

      <button id="resetBtn">
        Reset EQ
      </button>

    </div>


    <div class="panel">

      <h2>Volume</h2>

      <input
        id="volume"
        type="range"
        min="0"
        max="100"
        value="80"
      >

      <span id="volumeText">80%</span>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
